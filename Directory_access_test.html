<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>List Files in Directory</title>
</head>
<body>
  <button id="pickDir">Pick Directory</button>
  <ul id="fileList"></ul>

  <script>
    const pickDirBtn = document.getElementById('pickDir');
    const fileList = document.getElementById('fileList');

    pickDirBtn.addEventListener('click', async () => {
      try {

        const dirHandle = await window.showDirectoryPicker();

        fileList.innerHTML = ''; 

        
        for await (const [name, handle] of dirHandle.entries()) {
          const li = document.createElement('li');
          li.textContent = `${name} (${handle.kind})`;
          fileList.appendChild(li);
        }
      } catch (err) {
        console.error('Error accessing directory:', err);
        alert('Directory access was cancelled or not supported.');
      }
    });
  </script>
</body>
</html>
