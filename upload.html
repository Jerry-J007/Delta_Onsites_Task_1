<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html" class="brand">▶ <span>Upload</span></a>
        <div class="nav-links" id="auth-links"></div>
    </nav>

    <div class="auth-container">
        <h2>Upload</h2>
        <form id="upload-form">
           
            <input type="file" id="video-file" accept="video/mp4/jpeg" required style="padding: 10px; background: transparent; border: none;">
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="upload-btn">
                Upload
            </button>
             <button onclick="button();"> Open File </button><br>
            <button  id="pickDir"> Show all the files </button><br>
            <button id="Upload";>Upload file to a selected File</button><br>
            <ul id="fileList"></ul>
            <pre id="textarea" contenteditable></pre>
            <img id="img-from-local-storage" />
        </form>
        <p id="upload-status" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>
   
<script src="tester1.js"></script>
<script src="tester2.js"></script>

    <script src="app.js"></script>
    <script>
const imageInput = document.getElementById('video-file');

imageInput.addEventListener('change', event => {
  // Save the image to localStorage
  const image = event.target.files[0];
  const reader = new FileReader();

  reader.addEventListener('load', () => {
    localStorage.setItem('image', reader.result);
  });

  if (image) {
    reader.readAsDataURL(image);
  }

 
  const newImage = document.getElementById(
    'img-from-local-storage',
  );

  newImage.src = localStorage.getItem('image');
});

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            const statusText = document.getElementById('upload-status');
            const btn = document.getElementById('upload-btn');

            if (!token) {
                statusText.innerText = "Error: You must be logged in to upload.";
                statusText.style.color = "var(--dtube-red)";
                return;
            }

            const title = document.getElementById('video-title').value;
            const file = document.getElementById('video-file').files[0];

            // Package the file securely
            const formData = new FormData();
            formData.append('title', title);
            formData.append('videoFile', file);

            statusText.innerText = "⏳ Uploading... please wait.";
            statusText.style.color = "var(--text-muted)";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/videos/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                       
                    },
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    statusText.innerText = "✅ Upload successful!";
                    statusText.style.color = "#4CAF50";
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    statusText.innerText = "❌ " + data.error;
                    statusText.style.color = "var(--dtube-red)";
                }
            } catch (err) {
                statusText.innerText = "❌ Network Error";
                statusText.style.color = "var(--dtube-red)";
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
