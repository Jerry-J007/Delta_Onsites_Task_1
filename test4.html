<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple File Manager</title>
    <style>
        body { font-family: monospace; margin: 20px; line-height: 1.6; }
        section { border: 1px solid #999; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        h3 { margin-top: 0; }
        input, button { padding: 5px; margin-top: 5px; }
        pre { background: #eee; padding: 10px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Simple File Manager</h2>


    <section>
        <h3>1. Upload Files to Server</h3>
        <form id="uploadForm">
            <input type="text" id="folderInput" placeholder="Target folder (e.g., docs)"> <br>
            <input type="file" id="fileInput" multiple required> <br>
            <button type="submit">Upload File(s)</button>
            <span id="status"></span>
        </form>
    </section>


    <section>
        <h3>2. List Local Directory Files</h3>
        <button id="pickDirBtn">Pick Directory</button>
        <ul id="dirList"></ul>
    </section>

    <section>
        <h3>3. View Local File Content</h3>
        <button id="pickFileBtn">Open File</button>
        <pre id="fileContent">Select a text file to view its contents...</pre>
    </section>

    <script>
     
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.innerText = " Uploading...";

            const formData = new FormData();
            formData.append('folder', document.getElementById('folderInput').value);
            
            const files = document.getElementById('fileInput').files;
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const result = await response.json();
                status.innerText = ` ${result.message}`;
            } catch (error) {
                status.innerText = " Upload failed.";
            }
        });

       
        document.getElementById('pickDirBtn').addEventListener('click', async () => {
            try {
                const dirHandle = await window.showDirectoryPicker();
                const list = document.getElementById('dirList');
                list.innerHTML = ''; 

                for await (const [name, handle] of dirHandle.entries()) {
                    const li = document.createElement('li');
                    li.textContent = `${name} (${handle.kind})`;
                    list.appendChild(li);
                }
            } catch (err) {
                console.error(err);
            }
        });


        document.getElementById('pickFileBtn').addEventListener('click', async () => {
            try {
                const [fileHandle] = await window.showOpenFilePicker();
                const fileData = await fileHandle.getFile();
                const text = await fileData.text();
                document.getElementById('fileContent').innerText = text;
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
